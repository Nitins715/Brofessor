# ==============================================================================
# Brofessor Docker Compose
# Single command startup for Web App + PostgreSQL with pgvector
# Run with: docker compose up -d
# ==============================================================================

services:
  # Primary Web Application (Django + LangGraph RAG)
  brofessor:
    build: .
    image: nitins715/brofessor:latest
    container_name: brofessor
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Maps local host directory so every PC keeps its own persistent media, logs, and cache
      - ./data:/data
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-brofessor-local-storage-secret-key-2026}
      - DJANGO_ALLOWED_HOSTS=*
      - DATA_DIR=/data
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-brofessor_db}
      - DB_USER=${DB_USER:-brofessor_user}
      - DB_PASSWORD=${DB_PASSWORD:-brofessor_password}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-brofessor-rag}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # PostgreSQL 16 with Native pgvector Extension
  db:
    image: pgvector/pgvector:pg16
    container_name: brofessor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brofessor_db}
      POSTGRES_USER: ${DB_USER:-brofessor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brofessor_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brofessor_user} -d ${DB_NAME:-brofessor_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # Optional Redis Profile (Only started if requested with: docker compose --profile with-redis up)
  # ----------------------------------------------------------------------------
  redis:
    profiles: ["with-redis", "full-stack"]
    image: redis:7-alpine
    container_name: brofessor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
