{# Reusable Loading State Component #}
{# Props: label, spinner_only, extra_classes #}
<div class="flex flex-col items-center justify-center p-8 text-center {{ extra_classes }}">
  <div class="relative flex items-center justify-center">
    <div class="w-6 h-6 border-2 border-zinc-200 dark:border-zinc-800 rounded-full"></div>
    <div class="w-6 h-6 border-2 border-indigo-600 dark:border-indigo-400 rounded-full border-t-transparent animate-spin absolute top-0 left-0"></div>
  </div>
  {% if not spinner_only %}
    <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-3 font-medium">{{ label|default:'Processing...' }}</p>
  {% endif %}
</div>
