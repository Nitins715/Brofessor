{# Reusable Modal Component #}
{# Props: id, title, subtitle, max_width #}
<div id="{{ id }}"
     data-modal-dialog
     class="fixed inset-0 z-50 hidden overflow-y-auto"
     aria-labelledby="{{ id }}-title"
     role="dialog"
     aria-modal="true">
  {# Backdrop #}
  <div data-modal-backdrop
       onclick="window.BrofessorModal.close('{{ id }}')"
       class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-150 opacity-0"></div>

  {# Centering wrapper #}
  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div data-modal-content
         class="relative transform overflow-hidden rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-left shadow-2xl transition-all duration-150 scale-95 opacity-0 w-full {% if max_width %}{{ max_width }}{% else %}max-w-lg{% endif %} my-8">
      {# Header #}
      <div class="px-6 py-4 border-b border-zinc-100 dark:border-zinc-800/80 flex items-center justify-between">
        <div>
          <h3 id="{{ id }}-title" class="text-base font-semibold text-zinc-900 dark:text-zinc-100">
            {{ title }}
          </h3>
          {% if subtitle %}
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">{{ subtitle }}</p>
          {% endif %}
        </div>
        <button type="button"
                onclick="window.BrofessorModal.close('{{ id }}')"
                class="rounded-lg p-1.5 text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-smooth">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          <span class="sr-only">Close</span>
        </button>
      </div>

      {# Body #}
      <div class="px-6 py-5">
        {{ body|default:''|safe }}
      </div>

      {# Footer #}
      {% if footer %}
        <div class="px-6 py-4 bg-zinc-50/50 dark:bg-zinc-900/50 border-t border-zinc-100 dark:border-zinc-800/80 flex items-center justify-end gap-3">
          {{ footer|safe }}
        </div>
      {% endif %}
    </div>
  </div>
</div>
