components:
  schemas:
    ActionTypeEnum:
      enum:
      - revise_topic
      - study_concept
      - read_source
      - practice_questions
      - build_project
      - reassess_skill
      type: string
      description: |-
        * `revise_topic` - Revise a Topic
        * `study_concept` - Study a Missing Concept
        * `read_source` - Read/Revisit a Source
        * `practice_questions` - Practice Questions
        * `build_project` - Build/Practice a Project
        * `reassess_skill` - Reassess a Weak Skill
    AnswerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question_id:
          type: string
          format: uuid
          readOnly: true
        user_response:
          type: string
        accuracy:
          type: number
          format: double
          description: Normalized accuracy value between 0.0 and 1.0.
        score_awarded:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_correct:
          type: boolean
          nullable: true
        feedback:
          type: string
      required:
      - id
      - question_id
      - user_response
    ArticleSourceCreate:
      type: object
      description: Payload for submitting web article or blog URL.
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
          default: ''
          maxLength: 255
        metadata:
          type: object
          additionalProperties: {}
        run_async:
          type: boolean
          default: true
      required:
      - url
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        skill:
          type: string
          format: uuid
          nullable: true
        skill_name:
          type: string
          readOnly: true
        topic:
          type: string
          format: uuid
          nullable: true
        topic_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AssessmentStatusEnum'
        difficulty_level:
          $ref: '#/components/schemas/DifficultyLevelB85Enum'
        passing_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Passing threshold percentage (e.g. 70.00%).
        time_limit_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Optional time limit in minutes.
        questions_count:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - questions_count
      - skill_name
      - title
      - topic_name
      - updated_at
    AssessmentStatusEnum:
      enum:
      - draft
      - active
      - completed
      - failed
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `completed` - Completed
        * `failed` - Failed
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        assessment:
          type: string
          format: uuid
        assessment_title:
          type: string
          readOnly: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_points_possible:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        total_points_awarded:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Achieved score percentage (0.00 to 100.00).
        passed:
          type: boolean
          nullable: true
        feedback:
          type: string
      required:
      - assessment
      - assessment_title
      - id
    AttemptResult:
      type: object
      properties:
        attempt_id:
          type: string
        assessment_id:
          type: string
        title:
          type: string
        skill_name:
          type: string
          nullable: true
        topic_name:
          type: string
          nullable: true
        score_percentage:
          type: number
          format: double
        passed:
          type: boolean
        total_points_possible:
          type: number
          format: double
        total_points_awarded:
          type: number
          format: double
        total_questions:
          type: integer
        correct_answers_count:
          type: integer
        answers:
          type: array
          items: {}
        completed_at:
          type: string
        evidence_id:
          type: string
          nullable: true
      required:
      - answers
      - assessment_id
      - attempt_id
      - completed_at
      - correct_answers_count
      - evidence_id
      - passed
      - score_percentage
      - skill_name
      - title
      - topic_name
      - total_points_awarded
      - total_points_possible
      - total_questions
    CalculatedMastery:
      type: object
      description: Serializer for CalculatedMastery model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skill:
          type: string
          format: uuid
          nullable: true
        skill_name:
          type: string
          readOnly: true
        topic:
          type: string
          format: uuid
          nullable: true
        topic_name:
          type: string
          readOnly: true
        mastery_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Calculated mastery level percentage (0.00 to 100.00).
        mastery_level:
          $ref: '#/components/schemas/MasteryLevelEnum'
        knowledge_coverage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Calculated knowledge coverage percentage (0.00 to 100.00).
        confidence_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Confidence metric based on evidence freshness and diversity.
        evidence_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        last_calculated_at:
          type: string
          format: date-time
          readOnly: true
        calculation_metadata:
          description: Stores algorithm version, breakdown by evidence type, and intermediate
            weights.
      required:
      - id
      - last_calculated_at
      - skill_name
      - topic_name
    Citation:
      type: object
      description: Detailed attribution reference for a chunk used in answering.
      properties:
        chunk_id:
          type: string
        chunk_index:
          type: integer
        document:
          type: object
          additionalProperties: {}
        source:
          type: object
          additionalProperties: {}
        rank:
          type: integer
        similarity_score:
          type: number
          format: double
        rerank_score:
          type: number
          format: double
          nullable: true
        page:
          type: integer
          nullable: true
        timestamp:
          type: string
          nullable: true
        snippet:
          type: string
      required:
      - chunk_id
      - chunk_index
      - document
      - rank
      - similarity_score
      - snippet
      - source
    Concept:
      type: object
      description: Serializer for Concept instances with mapped skills information.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        domain:
          type: string
          format: uuid
          nullable: true
        topic:
          type: string
          format: uuid
          nullable: true
        skills:
          type: string
          readOnly: true
        evidence_count:
          type: string
          readOnly: true
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - evidence_count
      - id
      - name
      - skills
      - slug
      - updated_at
    CreateAssessmentRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        skill_id:
          type: string
          format: uuid
          nullable: true
        topic_id:
          type: string
          format: uuid
          nullable: true
        difficulty_level:
          allOf:
          - $ref: '#/components/schemas/DifficultyLevelB85Enum'
          default: intermediate
        auto_generate:
          type: boolean
          default: true
        passing_score:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 70.0
        time_limit_minutes:
          type: integer
          nullable: true
    DifficultyLevelB85Enum:
      enum:
      - basic
      - intermediate
      - advanced
      - expert
      type: string
      description: |-
        * `basic` - Basic
        * `intermediate` - Intermediate
        * `advanced` - Advanced
        * `expert` - Expert
    Document:
      type: object
      description: Serializer for processed documents.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 512
        content:
          type: string
          description: Extracted text or markdown content.
        content_hash:
          type: string
          description: SHA-256 for change detection.
          maxLength: 64
        metadata: {}
        chunks_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunks_count
      - content
      - created_at
      - id
      - updated_at
    DocumentChunk:
      type: object
      description: Serializer for individual document chunks.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        chunk_index:
          type: integer
          maximum: 2147483647
          minimum: 0
        content:
          type: string
        token_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chunk_index
      - content
      - created_at
      - id
    Domain:
      type: object
      description: Serializer for knowledge Domain.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        is_selected:
          type: boolean
          description: Currently active/selected domain for the user.
        topic_count:
          type: string
          readOnly: true
        skill_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - skill_count
      - slug
      - topic_count
      - updated_at
    Evidence:
      type: object
      description: Serializer for Evidence records.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        evidence_type:
          $ref: '#/components/schemas/EvidenceTypeEnum'
        title:
          type: string
          maxLength: 255
        description:
          type: string
        source:
          type: string
          format: uuid
          nullable: true
        source_name:
          type: string
          readOnly: true
        concept:
          type: string
          format: uuid
          nullable: true
        concept_name:
          type: string
          readOnly: true
        topic:
          type: string
          format: uuid
          nullable: true
        topic_name:
          type: string
          readOnly: true
        skill:
          type: string
          format: uuid
          nullable: true
        skill_name:
          type: string
          readOnly: true
        raw_data:
          description: Raw payload (e.g. self-ratings, git commit SHAs, quiz scores,
            note references).
        confidence_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          description: Evaluation weighting factor (0.00 to 1.00).
        recorded_at:
          type: string
          format: date-time
      required:
      - concept_name
      - evidence_type
      - id
      - skill_name
      - source_name
      - title
      - topic_name
    EvidenceTypeEnum:
      enum:
      - declared
      - practical
      - learning
      - assessment
      type: string
      description: |-
        * `declared` - User-Declared Knowledge
        * `practical` - Practical/Project Evidence
        * `learning` - Learning Evidence
        * `assessment` - Assessment Result
    GapTypeEnum:
      enum:
      - no_evidence
      - weak_coverage
      - weak_assessment
      - below_level
      type: string
      description: |-
        * `no_evidence` - Little or No Evidence
        * `weak_coverage` - Weak Knowledge Coverage
        * `weak_assessment` - Weak Assessment Performance
        * `below_level` - Mastery Below Expected Roadmap Level
    KnowledgeExtractionResponse:
      type: object
      description: Result after triggering source knowledge extraction.
      properties:
        source_id:
          type: string
        concepts_extracted:
          type: integer
        concepts_mapped:
          type: integer
        evidence_recorded:
          type: integer
        affected_skills:
          type: array
          items: {}
        status:
          type: string
        error:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
      required:
      - affected_skills
      - concepts_extracted
      - concepts_mapped
      - evidence_recorded
      - metadata
      - source_id
      - status
    KnowledgeGap:
      type: object
      description: Serializer for KnowledgeGap model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skill:
          type: string
          format: uuid
          nullable: true
        skill_name:
          type: string
          readOnly: true
        topic:
          type: string
          format: uuid
          nullable: true
        topic_name:
          type: string
          readOnly: true
        gap_type:
          $ref: '#/components/schemas/GapTypeEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        status:
          $ref: '#/components/schemas/KnowledgeGapStatusEnum'
        title:
          type: string
          maxLength: 255
        description:
          type: string
        expected_level:
          type: string
          maxLength: 32
        current_level:
          type: string
          maxLength: 32
        current_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        target_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        identified_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        metadata: {}
      required:
      - gap_type
      - id
      - skill_name
      - title
      - topic_name
    KnowledgeGapStatusEnum:
      enum:
      - active
      - resolved
      type: string
      description: |-
        * `active` - Active
        * `resolved` - Resolved
    KnowledgeProfileResponse:
      type: object
      description: High-level personal knowledge model profile across all roadmap
        skills.
      properties:
        total_encountered_skills:
          type: integer
        total_roadmap_skills:
          type: integer
        coverage_percentage:
          type: number
          format: double
        total_concepts_extracted:
          type: integer
        total_evidence_items:
          type: integer
        evidence_by_type:
          type: object
          additionalProperties: {}
        encountered_skills:
          type: array
          items: {}
      required:
      - coverage_percentage
      - encountered_skills
      - evidence_by_type
      - total_concepts_extracted
      - total_encountered_skills
      - total_evidence_items
      - total_roadmap_skills
    MasteryLevelEnum:
      enum:
      - beginner
      - intermediate
      - advanced
      - expert
      type: string
      description: |-
        * `beginner` - Beginner
        * `intermediate` - Intermediate
        * `advanced` - Advanced
        * `expert` - Expert
    PDFUpload:
      type: object
      description: Payload for uploading a local PDF document.
      properties:
        file:
          type: string
          format: uri
        title:
          type: string
          default: ''
          maxLength: 255
        metadata:
          type: object
          additionalProperties: {}
        run_async:
          type: boolean
          default: true
      required:
      - file
    PatchedUpdateRecommendation:
      type: object
      description: Payload to update recommendation status.
      properties:
        status:
          $ref: '#/components/schemas/StatusEfbEnum'
    PriorityEnum:
      enum:
      - urgent
      - high
      - medium
      - low
      type: string
      description: |-
        * `urgent` - Urgent
        * `high` - High
        * `medium` - Medium
        * `low` - Low
    Question:
      type: object
      description: Student-facing question serializer (excludes correct answer during
        active attempts).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question_type:
          $ref: '#/components/schemas/QuestionTypeEnum'
        difficulty_level:
          type: string
          description: basic, intermediate, advanced, or expert
          maxLength: 32
        prompt:
          type: string
          description: Question text or prompt.
        options:
          type: array
          items:
            type: object
            additionalProperties: {}
        points:
          type: integer
          maximum: 2147483647
          minimum: 0
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - options
      - prompt
    QuestionTypeEnum:
      enum:
      - mcq
      - textual
      - explanation
      - code
      type: string
      description: |-
        * `mcq` - Multiple Choice
        * `textual` - Textual / Conceptual
        * `explanation` - Explanation / Project-based
        * `code` - Code / Practical
    RAGChatRequest:
      type: object
      description: Request payload for querying stored knowledge via the RAG pipeline.
      properties:
        query:
          type: string
          maxLength: 2000
        conversation_id:
          type: string
          format: uuid
          nullable: true
        domain_id:
          type: string
          format: uuid
          nullable: true
        retrieval_top_k:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
        rerank_top_k:
          type: integer
          maximum: 20
          minimum: 1
          default: 4
        source_types:
          type: array
          items:
            type: string
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        document_ids:
          type: array
          items:
            type: string
            format: uuid
        min_similarity:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
      required:
      - query
    RAGChatResponse:
      type: object
      description: Full response envelope containing answer, citations, and conversation
        linkage.
      properties:
        conversation_id:
          type: string
        message_id:
          type: string
        query:
          type: string
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        retrieved_count:
          type: integer
        reranked_count:
          type: integer
        tokens_used:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
      required:
      - answer
      - citations
      - conversation_id
      - message_id
      - metadata
      - query
      - reranked_count
      - retrieved_count
      - tokens_used
    Recommendation:
      type: object
      description: Serializer for Recommendation model.
      properties:
        id:
          type: string
          format: uuid
