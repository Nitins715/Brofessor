  /api/knowledge/recommendations/{id}/:
    get:
      operationId: knowledge_recommendations_retrieve
      description: View and update recommendation status (completed, dismissed).
      summary: Get Recommendation Detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - knowledge
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
          description: ''
    patch:
      operationId: knowledge_recommendations_partial_update
      description: View and update recommendation status (completed, dismissed).
