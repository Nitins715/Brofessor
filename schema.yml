openapi: 3.0.3
info:
  title: Brofessor API
  version: 1.0.0
  description: Local-first Personal Knowledge System API
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: Lists all primary module endpoints of the Brofessor system.
      summary: API Root
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/:
    get:
      operationId: accounts_retrieve
      description: Placeholder endpoint for accounts module.
      tags:
      - accounts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/assessments/:
    get:
      operationId: assessments_retrieve
      description: Overview endpoint for Assessment & Scoring Engine module.
      summary: Assessments Module Overview
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/assessments/assessments/:
    get:
      operationId: assessments_assessments_list
      description: List assessments or create a new assessment suite for a skill/topic.
      summary: List Assessments
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assessment'
          description: ''
    post:
      operationId: assessments_assessments_create
      description: List assessments or create a new assessment suite for a skill/topic.
      summary: Create Assessment
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
  /api/assessments/assessments/{id}/:
    get:
      operationId: assessments_assessments_retrieve
      description: View details of a specific Assessment.
      summary: Assessment Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
          description: ''
  /api/assessments/assessments/{id}/attempt/:
    post:
      operationId: assessments_assessments_attempt_create
      description: Begin an attempt on an Assessment.
      summary: Start Assessment Attempt
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/assessments/assessments/{id}/questions/:
    get:
      operationId: assessments_assessments_questions_list
      description: Retrieve questions for an assessment or trigger regeneration.
      summary: Get Assessment Questions
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
          description: ''
    post:
      operationId: assessments_assessments_questions_create
      description: Retrieve questions for an assessment or trigger regeneration.
      summary: Generate Questions
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
          description: ''
  /api/assessments/attempts/{attempt_id}/answers/:
    post:
      operationId: assessments_attempts_answers_create
      description: Submit an answer to a question during an attempt and receive immediate
        evaluation.
      summary: Submit & Evaluate Answer
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
          description: ''
  /api/assessments/attempts/{attempt_id}/complete/:
    post:
      operationId: assessments_attempts_complete_create
      description: Finalize an attempt, calculate total accuracy & points, and emit
        assessment evidence.
      summary: Complete Attempt
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/assessments/attempts/{attempt_id}/result/:
    get:
      operationId: assessments_attempts_result_retrieve
      description: View results of an attempt.
      summary: Get Attempt Result
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/assessments/history/skills/{skill_id}/:
    get:
      operationId: assessments_history_skills_retrieve
      description: View ongoing assessment history using up to the latest 3 assessments
        for a skill.
      summary: Skill Assessment History (Latest 3)
      parameters:
      - in: path
        name: skill_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAssessmentHistory'
          description: ''
  /api/assessments/history/topics/{topic_id}/:
    get:
      operationId: assessments_history_topics_retrieve
      description: View ongoing assessment history using up to the latest 3 assessments
        for a topic.
      summary: Topic Assessment History (Latest 3)
      parameters:
      - in: path
        name: topic_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillAssessmentHistory'
          description: ''
  /api/conversations/:
    get:
      operationId: conversations_retrieve
      description: List recent conversations or create a new conversation.
      summary: List Conversations
      tags:
      - conversations
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: conversations_create
      description: List recent conversations or create a new conversation.
      summary: Create Conversation
      tags:
      - conversations
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/conversations/{id}/:
    get:
      operationId: conversations_retrieve_2
      description: Retrieve complete message history and grounding citations for a
